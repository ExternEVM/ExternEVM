version: "3.9"

networks:
  externevm:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:

services:
  # ── Execution Layer ────────────────────────────────────────────────────────

  el-node1:
    build:
      context: .
      dockerfile: docker/reth.Dockerfile
    container_name: externevm-el-node1
    networks: [externevm]
    ports:
      - "8545:8545"
      - "8551:8551"
      - "30303:30303"
    volumes:
      - node1-data:/data
      - ./config:/config:ro
    environment:
      RUST_LOG: info
      EXTERNEVM_VALIDATOR_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      EXTERNEVM_PEER_WAIT_MS: "300"
    command: >
      node
      --chain /config/genesis.json
      --http --http.api eth,net,web3,debug,trace,admin
      --http.addr 0.0.0.0 --http.port 8545
      --authrpc.addr 0.0.0.0 --authrpc.port 8551
      --authrpc.jwtsecret /config/jwt.hex
      --port 30303 --discovery.port 30303 --discovery.v5.port 9200
      --datadir /data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 10

  el-node2:
    build:
      context: .
      dockerfile: docker/reth.Dockerfile
    container_name: externevm-el-node2
    networks: [externevm]
    ports:
      - "8546:8545"
      - "8552:8551"
      - "30304:30303"
    volumes:
      - node2-data:/data
      - ./config:/config:ro
    environment:
      RUST_LOG: info
      EXTERNEVM_VALIDATOR_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      EXTERNEVM_PEER_WAIT_MS: "300"
    command: >
      node
      --chain /config/genesis.json
      --http --http.api eth,net,web3,debug,trace,admin
      --http.addr 0.0.0.0 --http.port 8545
      --authrpc.addr 0.0.0.0 --authrpc.port 8551
      --authrpc.jwtsecret /config/jwt.hex
      --port 30303 --discovery.port 30303 --discovery.v5.port 9200
      --datadir /data
      --trusted-peers enode://$(cat /data/node1.enode)@externevm-el-node1:30303
    depends_on:
      el-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 10

  el-node3:
    build:
      context: .
      dockerfile: docker/reth.Dockerfile
    container_name: externevm-el-node3
    networks: [externevm]
    ports:
      - "8547:8545"
      - "8553:8551"
      - "30305:30303"
    volumes:
      - node3-data:/data
      - ./config:/config:ro
    environment:
      RUST_LOG: info
      EXTERNEVM_VALIDATOR_ADDRESS: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
      EXTERNEVM_PEER_WAIT_MS: "300"
    command: >
      node
      --chain /config/genesis.json
      --http --http.api eth,net,web3,debug,trace,admin
      --http.addr 0.0.0.0 --http.port 8545
      --authrpc.addr 0.0.0.0 --authrpc.port 8551
      --authrpc.jwtsecret /config/jwt.hex
      --port 30303 --discovery.port 30303 --discovery.v5.port 9200
      --datadir /data
      --trusted-peers enode://$(cat /data/node1.enode)@externevm-el-node1:30303
    depends_on:
      el-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Consensus Layer ────────────────────────────────────────────────────────

  cl-node1:
    build:
      context: .
      dockerfile: docker/consensus.Dockerfile
    container_name: externevm-cl-node1
    networks: [externevm]
    volumes:
      - ./config:/config:ro
    environment:
      RUST_LOG: info
    command: >
      --validator 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      --validators 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266,0x70997970C51812dc3A010C7d01b50e0d17dc79C8,0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC
      --el-auth-url http://externevm-el-node1:8551
      --el-rpc-url http://externevm-el-node1:8545
      --all-el-auth-urls http://externevm-el-node1:8551,http://externevm-el-node2:8551,http://externevm-el-node3:8551
      --jwt-secret /config/jwt.hex
      --slot-time 5
    depends_on:
      el-node1:
        condition: service_healthy
      el-node2:
        condition: service_healthy
      el-node3:
        condition: service_healthy

  cl-node2:
    build:
      context: .
      dockerfile: docker/consensus.Dockerfile
    container_name: externevm-cl-node2
    networks: [externevm]
    volumes:
      - ./config:/config:ro
    environment:
      RUST_LOG: info
    command: >
      --validator 0x70997970C51812dc3A010C7d01b50e0d17dc79C8
      --validators 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266,0x70997970C51812dc3A010C7d01b50e0d17dc79C8,0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC
      --el-auth-url http://externevm-el-node2:8551
      --el-rpc-url http://externevm-el-node2:8545
      --all-el-auth-urls http://externevm-el-node1:8551,http://externevm-el-node2:8551,http://externevm-el-node3:8551
      --jwt-secret /config/jwt.hex
      --slot-time 5
    depends_on:
      el-node1:
        condition: service_healthy
      el-node2:
        condition: service_healthy
      el-node3:
        condition: service_healthy

  cl-node3:
    build:
      context: .
      dockerfile: docker/consensus.Dockerfile
    container_name: externevm-cl-node3
    networks: [externevm]
    volumes:
      - ./config:/config:ro
    environment:
      RUST_LOG: info
    command: >
      --validator 0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC
      --validators 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266,0x70997970C51812dc3A010C7d01b50e0d17dc79C8,0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC
      --el-auth-url http://externevm-el-node3:8551
      --el-rpc-url http://externevm-el-node3:8545
      --all-el-auth-urls http://externevm-el-node1:8551,http://externevm-el-node2:8551,http://externevm-el-node3:8551
      --jwt-secret /config/jwt.hex
      --slot-time 5
    depends_on:
      el-node1:
        condition: service_healthy
      el-node2:
        condition: service_healthy
      el-node3:
        condition: service_healthy